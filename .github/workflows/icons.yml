name: Icons

# Generate the native Windows PNG/ICO assets from the SVG using Node built-ins.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 将生成的图标提交回当前分支
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 生成原生图标
        run: node scripts/render-icons.mjs
      - name: 校验尺寸与重复生成结果
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { icons } from './scripts/render-icons.mjs';
          const expected = {
            '32x32.png': 32, '128x128.png': 128, 'icon.png': 512,
            'icon_16x16.png': 16, 'icon_32x32.png': 32,
            'icon_48x48.png': 48, 'icon_256x256.png': 256
          };
          const before = new Map();
          for (const [name, size] of Object.entries(expected)) {
            const b = readFileSync(join(icons, name));
            assert.equal(b.readUInt32BE(16), size, name);
            assert.equal(b.readUInt32BE(20), size, name);
            before.set(name, b);
          }
          const ico = readFileSync(join(icons, 'icon.ico'));
          assert.equal(ico.readUInt16LE(2), 1);
          assert.equal(ico.readUInt16LE(4), 4);
          before.set('icon.ico', ico);
          execFileSync(process.execPath, ['scripts/render-icons.mjs'], { stdio: 'inherit' });
          for (const [name, bytes] of before) {
            assert.deepEqual(readFileSync(join(icons, name)), bytes, name);
          }
          console.log('native icon dimensions and deterministic output OK');
          NODE
      - name: 提交
        if: inputs.commit
        run: |
          git add -- crates/voicebar/icons
          if git diff --cached --quiet -- crates/voicebar/icons; then echo "icons already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(icons): regenerate native app icons from app-icon.svg"
          git push
