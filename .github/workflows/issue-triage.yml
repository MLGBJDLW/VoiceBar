name: Issue 助手

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 自动打标签
        uses: actions/github-script@v9
        with:
          script: |
            const body = (context.payload.issue.body || '').toLowerCase();
            const title = context.payload.issue.title.toLowerCase();
            const text = `${title}\n${body}`;
            const labels = [];
            if (/bug|错误|崩溃|闪退|无法|失败|crash|error/.test(text)) labels.push('bug');
            if (/功能|建议|feature|request|希望|能否/.test(text)) labels.push('enhancement');
            if (/识别|asr|模型|engine|密钥|key|api/.test(text)) labels.push('area:provider');
            if (/快捷键|hotkey|shortcut|托盘|输入/.test(text)) labels.push('area:input');
            if (labels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels,
              });
            }
