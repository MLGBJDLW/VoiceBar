name: Release

# release-plz creates vX.Y.Z tags and draft releases. Re-runs may replace assets
# only while the exact release ID is still a draft; published releases are kept.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  release:
    types: [edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建的标签（例如 v0.1.0）
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CARGO_INCREMENTAL: '0'

jobs:
  create-release:
    name: 准备草稿 Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      release-id: ${{ steps.decide.outputs.release-id }}
      should-build: ${{ steps.decide.outputs.should-build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 解析标签、复用或创建草稿 Release
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_DRAFT: ${{ github.event.release.draft }}
          EVENT_RELEASE_ID: ${{ github.event.release.id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            tag="$EVENT_RELEASE_TAG"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::标签必须是 vX.Y.Z 格式的语义版本。"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::标签 $tag 不存在于仓库中。"
            exit 1
          fi
          if [ "$EVENT_NAME" = "release" ]; then
            if [ "$EVENT_RELEASE_DRAFT" != "true" ]; then
              echo "Release $tag 已正式发布，跳过，避免覆盖已发布资产。"
              echo "should-build=false" >> "$GITHUB_OUTPUT"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            id="$EVENT_RELEASE_ID"
          else
            # List authenticated releases: the tag endpoint can omit drafts.
            json=$(gh api --paginate "repos/$REPO/releases?per_page=100" |
              jq -s --arg tag "$tag" '[.[][] | select(.tag_name == $tag)]')
            count=$(echo "$json" | jq 'length')
            if [ "$count" -gt 1 ]; then
              echo "::error::标签 $tag 对应多个 Release，拒绝选择或覆盖；请保留唯一草稿后重试。"
              exit 1
            elif [ "$count" -eq 1 ]; then
              id=$(echo "$json" | jq -r '.[0].id')
              draft=$(echo "$json" | jq -r '.[0].draft')
              if [ "$draft" != "true" ]; then
                echo "::error::Release $tag 已正式发布，拒绝重新构建覆盖资产。"
                exit 1
              fi
            else
              id=$(gh api -X POST "repos/$REPO/releases" \
                -f tag_name="$tag" -f name="VoiceBar $tag" -F draft=true -F prerelease=false | jq -r '.id')
            fi
          fi
          # Publish the reviewed notes from the exact tagged source tree.
          notes_path="docs/release/${tag#v}/RELEASE_NOTES.md"
          notes_file="$RUNNER_TEMP/voicebar-release-notes.md"
          git show "$tag:$notes_path" > "$notes_file"
          test -s "$notes_file" || { echo "::error::Missing reviewed release notes for $tag"; exit 1; }
          gh api "repos/$REPO/releases/$id" |
            jq -e --arg tag "$tag" '.draft == true and .tag_name == $tag' >/dev/null
          jq -n --arg tag "$tag" --rawfile body "$notes_file" '{tag_name: $tag, body: $body}' > "$RUNNER_TEMP/voicebar-release-notes.json"
          gh api -X PATCH "repos/$REPO/releases/$id" --input "$RUNNER_TEMP/voicebar-release-notes.json" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release-id=$id" >> "$GITHUB_OUTPUT"
          echo "should-build=true" >> "$GITHUB_OUTPUT"
          echo "will build $tag into draft release $id"

  build:
    name: 构建 NSIS 与便携版（Windows MSVC）
    needs: create-release
    if: needs.create-release.outputs.should-build == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      # Override the local GNU default for every cargo subprocess, including
      # the internal signer launched by make-latest-json.mjs.
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-windows-msvc
      - name: 准备 Windows 打包工具
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Installing NSIS failed' }
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin" -Filter fxc.exe -Recurse |
            Where-Object FullName -Match '[\\/]x64[\\/]fxc\.exe$' |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe was not found' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - name: 校验标签与 Cargo 版本
        id: version
        shell: pwsh
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Reading Cargo metadata failed' }
          $package = ($metadata | ConvertFrom-Json).packages | Where-Object name -EQ 'voicebar'
          if (@($package).Count -ne 1) { throw 'Expected exactly one voicebar package' }
          $version = $package.version
          if ($env:TAG -cne "v$version") { throw "Tag $env:TAG != Cargo version v$version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: 检查同一提交的格式与测试
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust format check failed' }
          cargo test --workspace --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust workspace tests failed' }
          node --test tests/update-manifest.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Update manifest tests failed' }
      - name: 构建原生安装包与便携 EXE
        shell: pwsh
        run: ./scripts/build.ps1 -Mode installer -Target x86_64-pc-windows-msvc
      - name: 打包 Windows 便携版
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = '.nexa/tmp/release-portable/files'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item 'VoiceBar.exe' "$stage/VoiceBar.exe"
          Copy-Item 'LICENSE' "$stage/LICENSE"
          Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/VoiceBar_$($env:VERSION)_x64-portable.zip" -CompressionLevel Optimal -Force
      - name: 签名并生成更新清单
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ needs.create-release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = "artifacts/VoiceBar_$($env:VERSION)_x64-setup.exe"
          # The manifest script invokes sign-update.ps1, then reads <bundle>.sig.
          node scripts/make-latest-json.mjs --tag $env:TAG --repo $env:REPO --bundle $bundle --out artifacts/latest.json
          if ($LASTEXITCODE -ne 0) { throw 'Signing or generating latest.json failed' }
          if (-not (Test-Path "$bundle.sig")) { throw 'Missing updater signature' }
          node scripts/verify-release.mjs --manifest artifacts/latest.json --assets-dir artifacts --tag $env:TAG --repo $env:REPO
          if ($LASTEXITCODE -ne 0) { throw 'Verifying latest.json failed' }
      - name: 保存已签名发布产物
        uses: actions/upload-artifact@v4
        with:
          name: voicebar-${{ needs.create-release.outputs.tag }}-windows-x64
          path: |
            artifacts/*_x64-setup.exe
            artifacts/*_x64-portable.zip
            artifacts/*.exe.sig
            artifacts/latest.json
          if-no-files-found: error
          retention-days: 3
      - name: 上传到唯一草稿 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          TAG: ${{ needs.create-release.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            "artifacts/VoiceBar_$($env:VERSION)_x64-setup.exe",
            "artifacts/VoiceBar_$($env:VERSION)_x64-portable.zip"
          )
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            $files += "artifacts/VoiceBar_$($env:VERSION)_x64-setup.exe.sig"
            $files += 'artifacts/latest.json'
          }
          foreach ($file in $files) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Missing release asset: $file" }
          }
          foreach ($file in $files) {
            # Recheck immediately before each mutation in case a maintainer
            # published the draft while this build was running.
            $json = gh api "repos/$env:REPO/releases/$env:RELEASE_ID"
            if ($LASTEXITCODE -ne 0) { throw 'Reading draft release failed' }
            $release = $json | ConvertFrom-Json
            if (-not $release.draft -or $release.tag_name -cne $env:TAG) { throw 'Release is no longer the expected draft; refusing upload' }
            $name = Split-Path $file -Leaf
            foreach ($old in @($release.assets | Where-Object name -EQ $name)) {
              gh api --method DELETE "repos/$env:REPO/releases/assets/$($old.id)"
              if ($LASTEXITCODE -ne 0) { throw "Replacing $name failed" }
            }
            $upload = ($release.upload_url -split '\{')[0]
            $encoded = [uri]::EscapeDataString($name)
            gh api --method POST "${upload}?name=$encoded" -H 'Content-Type: application/octet-stream' --input $file > $null
            if ($LASTEXITCODE -ne 0) { throw "Uploading $name failed" }
          }

  publish:
    name: 校验远端资产并正式发布
    needs: [create-release, build]
    if: needs.create-release.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 校验本次上传的字节与更新清单
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          TAG: ${{ needs.create-release.outputs.tag }}
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          release=$(gh api "repos/$REPO/releases/$RELEASE_ID")
          echo "$release" | jq -e --arg tag "$TAG" '.draft == true and .tag_name == $tag' >/dev/null
          expected=("VoiceBar_${version}_x64-setup.exe" "VoiceBar_${version}_x64-portable.zip")
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            expected+=("VoiceBar_${version}_x64-setup.exe.sig" "latest.json")
          elif echo "$release" | jq -e '.assets[] | select(.name == "latest.json" or (.name | endswith(".sig")))' >/dev/null; then
            echo "::error::草稿含旧的签名或清单，当前未配置签名密钥；拒绝发布残留更新资产。"
            exit 1
          fi
          mkdir -p .nexa/tmp/verify-release
          for name in "${expected[@]}"; do
            count=$(echo "$release" | jq --arg name "$name" '[.assets[] | select(.name == $name)] | length')
            [ "$count" = 1 ] || { echo "::error::缺少或重复资产：$name"; exit 1; }
            url=$(echo "$release" | jq -r --arg name "$name" '.assets[] | select(.name == $name) | .url')
            gh api -H 'Accept: application/octet-stream' "$url" > ".nexa/tmp/verify-release/$name"
            test -s ".nexa/tmp/verify-release/$name"
          done
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            node scripts/verify-release.mjs --manifest .nexa/tmp/verify-release/latest.json \
              --assets-dir .nexa/tmp/verify-release --tag "$TAG" --repo "$REPO"
          fi
          # A concurrent manual publication must never be overwritten.
          gh api "repos/$REPO/releases/$RELEASE_ID" |
            jq -e --arg tag "$TAG" '.draft == true and .tag_name == $tag' >/dev/null
          gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" -f tag_name="$TAG" -F draft=false >/dev/null
          echo "已发布：https://github.com/$REPO/releases/tag/$TAG"
