name: Release

# Called by GitHub when release-plz publishes a tag, by the draft-Release
# 'published' event, or manually. Bundle files use the standard Tauri names:
#   VoiceBar_<version>_x64-setup.exe, VoiceBar_<version>_x64_en-US.msi, .sig

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  release:
    types: [edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建的标签（例如 v0.1.0）
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  create-release:
    name: 准备草稿 Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      release-id: ${{ steps.decide.outputs.release-id }}
      should-build: ${{ steps.decide.outputs.should-build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 解析标签、复用或创建草稿 Release
        id: decide
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_DRAFT: ${{ github.event.release.draft }}
          EVENT_RELEASE_ID: ${{ github.event.release.id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          if [ "$event" = "release" ]; then
            tag="$EVENT_RELEASE_TAG"
          elif [ "$event" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="${{ github.ref_name }}"
          fi
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::标签 $tag 不存在于仓库中。"
            exit 1
          fi
          if [ "$event" = "release" ]; then
            if [ "$EVENT_RELEASE_DRAFT" != "true" ]; then
              echo "Release $tag 已正式发布，跳过（避免覆盖已发布资产）。"
              echo "should-build=false" >> "$GITHUB_OUTPUT"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            id="$EVENT_RELEASE_ID"
          else
            # `gh api` writes the error body to stdout on 404, so `|| true`
            # alone left `json` non-empty ('{"message":"Not Found"...}') and
            # every first release was wrongly reported as already published.
            # Decide on the HTTP status code instead of on empty output.
            if json=$(gh api "repos/$REPO/releases/tags/$tag" 2>/dev/null); then
              id=$(echo "$json" | jq -r '.id')
              draft=$(echo "$json" | jq -r '.draft')
              if [ "$draft" != "true" ]; then
                echo "::error::Release $tag 已正式发布，拒绝重新构建覆盖资产。请先手动将其转为草稿。"
                exit 1
              fi
            else
              # A bare `... | grep -o` aborts under `set -euo pipefail` when
              # grep finds nothing, so capture the text and match it instead.
              err=$(gh api "repos/$REPO/releases/tags/$tag" 2>&1 >/dev/null || true)
              case "$err" in
                *"HTTP 404"*) ;;
                *) echo "::error::读取 Release $tag 失败（既不存在也不是 404），先人工确认。"; exit 1 ;;
              esac
              id=$(gh api -X POST "repos/$REPO/releases" \
                -f tag_name="$tag" -f name="VoiceBar $tag" -F draft=true -F prerelease=false | jq -r '.id')
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release-id=$id" >> "$GITHUB_OUTPUT"
          echo "should-build=true" >> "$GITHUB_OUTPUT"
          echo "will build $tag into draft release $id"

  build:
    name: 构建安装包（${{ matrix.platform.name }}）
    needs: create-release
    if: needs.create-release.outputs.should-build == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x86_64
            runner: windows-latest
            # No `--no-bundle` here: that flag skips bundling entirely (it wins
            # over --bundles), so tauri-action would upload nothing and the
            # publish job would fail on the missing assets.
            args: '--bundles nsis,msi'
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.platform.name }}
      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund
      - name: 测试（同一提交必须先通过）
        run: npm test
      # Produces the NSIS installer plus its updater signature. With
      # createUpdaterArtifacts="v1Compatible" the installer itself is signed
      # (no extra .zip), which is what latest.json points at.
      - name: 构建并上传到草稿 Release
        uses: tauri-apps/tauri-action@v0
        env:
          # tauri-action uploads the bundles with this token; without it the step
          # builds for minutes and then fails with "GITHUB_TOKEN is required".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseName: 'VoiceBar ${{ needs.create-release.outputs.tag }}'
          releaseId: ${{ needs.create-release.outputs.release-id }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform.args }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: 下载已上传的安装包
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `gh release download` only accepts a tag, and a leftover draft with
          # the same tag made the tag lookup resolve to the wrong (empty)
          # release. Resolve the asset url from the release id instead and fetch
          # the bytes directly, which cannot be ambiguous.
          mkdir -p dist-assets
          # Keep the original asset name: make-latest-json.mjs rejects a bundle
          # whose file name does not match <Product>_<version>_x64-setup.exe.
          asset=$(gh api "repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release-id }}" \
                  --jq '.assets[] | select(.name | endswith("x64-setup.exe")) | .name + " " + .url' | head -n1)
          [ -n "$asset" ] || { echo "::error::草稿 Release 里没有 x64-setup.exe"; exit 1; }
          name=${asset% *}; url=${asset#* }
          gh api -H 'Accept: application/octet-stream' "$url" > "dist-assets/$name"
          ls -l dist-assets
      - name: 生成 latest.json（签名 + 哈希 + 下载地址）
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          bundle=$(ls dist-assets/VoiceBar_*x64-setup.exe | head -n1)
          node scripts/make-latest-json.mjs \
            --tag "${{ needs.create-release.outputs.tag }}" --repo "${{ github.repository }}" \
            --bundle "$bundle" --out latest.json
          cat latest.json
      - name: 上传 latest.json 到草稿 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Upload through the API: `gh release upload` only takes a tag, and a
          # duplicate draft made the tag ambiguous. Delete an existing
          # latest.json first so a re-run can replace it (--clobber equivalent).
          rel="${{ needs.create-release.outputs.release-id }}"
          repo="${{ github.repository }}"
          old=$(gh api "repos/$repo/releases/$rel/assets" \
                  --jq '.[] | select(.name == "latest.json") | .id' || true)
          if [ -n "$old" ]; then
            gh api -X DELETE "repos/$repo/releases/assets/$old"
          fi
          # Uploads must go to the dedicated host; api.github.com answers 404.
          gh api --method POST "https://uploads.github.com/repos/$repo/releases/$rel/assets?name=latest.json" \
            -H 'Content-Type: application/octet-stream' --input latest.json >/dev/null
          gh api "repos/$repo/releases/$rel" --jq '.assets[].name' | sort

  publish:
    name: 草稿转为正式 Release
    needs: [create-release, build]
    if: needs.create-release.outputs.should-build == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - name: 校验资产与更新清单
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          assets=$(gh api "repos/$REPO/releases/$RELEASE_ID" --jq '.assets[].name')
          echo "$assets"
          missing=0
          for suffix in x64-setup.exe x64_en-US.msi; do
            if ! grep -q "$suffix" <<<"$assets"; then
              echo "::error::缺少资产：*$suffix"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          # If a signing key is configured, the updater manifest is mandatory and
          # must agree with the published installer, otherwise clients would
          # either never update or fail signature verification after download.
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            if ! grep -q '^latest.json$' <<<"$assets"; then
              echo "::error::缺少 latest.json（已配置签名密钥，应用内更新依赖该文件）"
              exit 1
            fi
            mkdir -p verify
            gh release download "$RELEASE_ID" --repo "$REPO" --pattern "latest.json" --dir verify
            gh release download "$RELEASE_ID" --repo "$REPO" --pattern "*x64-setup.exe" --dir verify
            node scripts/verify-release.mjs --manifest verify/latest.json --assets-dir verify \
              --tag "$TAG" --repo "$REPO"
          fi
          gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" -F draft=false >/dev/null
          echo "已发布：https://github.com/$REPO/releases/tag/$TAG"
