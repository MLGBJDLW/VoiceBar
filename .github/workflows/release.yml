name: Release

# Called by GitHub when release-plz publishes a tag, by the draft-Release
# 'published' event, or manually. Bundle files use the standard Tauri names:
#   VoiceBar_<version>_x64-setup.exe, VoiceBar_<version>_x64_en-US.msi, .sig

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  release:
    types: [edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 瑕佹瀯寤虹殑鏍囩锛堜緥濡?v0.1.0锛?
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  create-release:
    name: 鍑嗗鑽夌 Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      release-id: ${{ steps.decide.outputs.release-id }}
      should-build: ${{ steps.decide.outputs.should-build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 瑙ｆ瀽鏍囩銆佸鐢ㄦ垨鍒涘缓鑽夌 Release
        id: decide
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_DRAFT: ${{ github.event.release.draft }}
          EVENT_RELEASE_ID: ${{ github.event.release.id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          if [ "$event" = "release" ]; then
            tag="$EVENT_RELEASE_TAG"
          elif [ "$event" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="${{ github.ref_name }}"
          fi
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::鏍囩 $tag 涓嶅瓨鍦ㄤ簬浠撳簱涓€?
            exit 1
          fi
          if [ "$event" = "release" ]; then
            if [ "$EVENT_RELEASE_DRAFT" != "true" ]; then
              echo "Release $tag 宸叉寮忓彂甯冿紝璺宠繃锛堥伩鍏嶈鐩栧凡鍙戝竷璧勪骇锛夈€?
              echo "should-build=false" >> "$GITHUB_OUTPUT"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            id="$EVENT_RELEASE_ID"
          else
            # `gh api` writes the error body to stdout on 404, so `|| true`
            # alone left `json` non-empty ('{"message":"Not Found"...}') and
            # every first release was wrongly reported as already published.
            # Decide on the HTTP status code instead of on empty output.
            if json=$(gh api "repos/$REPO/releases/tags/$tag" 2>/dev/null); then
              id=$(echo "$json" | jq -r '.id')
              draft=$(echo "$json" | jq -r '.draft')
              if [ "$draft" != "true" ]; then
                echo "::error::Release $tag 宸叉寮忓彂甯冿紝鎷掔粷閲嶆柊鏋勫缓瑕嗙洊璧勪骇銆傝鍏堟墜鍔ㄥ皢鍏惰浆涓鸿崏绋裤€?
                exit 1
              fi
            else
              status=$(gh api "repos/$REPO/releases/tags/$tag" 2>&1 >/dev/null | grep -o 'HTTP 404' || true)
              if [ -z "$status" ]; then
                echo "::error::璇诲彇 Release $tag 澶辫触锛堟棦涓嶆槸瀛樺湪锛屼篃涓嶆槸 404锛夛紝鍏堜汉宸ョ‘璁ゃ€?
                exit 1
              fi
              id=$(gh api -X POST "repos/$REPO/releases" \
                -f tag_name="$tag" -f name="VoiceBar $tag" -F draft=true -F prerelease=false | jq -r '.id')
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release-id=$id" >> "$GITHUB_OUTPUT"
          echo "should-build=true" >> "$GITHUB_OUTPUT"
          echo "will build $tag into draft release $id"

  build:
    name: 鏋勫缓瀹夎鍖咃紙${{ matrix.platform.name }}锛?
    needs: create-release
    if: needs.create-release.outputs.should-build == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x86_64
            runner: windows-latest
            # No `--no-bundle` here: that flag skips bundling entirely (it wins
            # over --bundles), so tauri-action would upload nothing and the
            # publish job would fail on the missing assets.
            args: '--bundles nsis,msi'
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.platform.name }}
      - name: 瀹夎鍓嶇渚濊禆
        run: npm ci --no-audit --no-fund
      - name: 娴嬭瘯锛堝悓涓€鎻愪氦蹇呴』鍏堥€氳繃锛?
        run: npm test
      # Produces the NSIS installer plus its updater signature. With
      # createUpdaterArtifacts="v1Compatible" the installer itself is signed
      # (no extra .zip), which is what latest.json points at.
      - name: 鏋勫缓骞朵笂浼犲埌鑽夌 Release
        uses: tauri-apps/tauri-action@v0
        env:
          # tauri-action uploads the bundles with this token; without it the step
          # builds for minutes and then fails with "GITHUB_TOKEN is required".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseName: 'VoiceBar ${{ needs.create-release.outputs.tag }}'
          releaseId: ${{ needs.create-release.outputs.release-id }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform.args }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: 涓嬭浇宸蹭笂浼犵殑瀹夎鍖?
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist-assets
          gh release download "${{ needs.create-release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*x64-setup.exe" --dir dist-assets
          ls -l dist-assets
      - name: 鐢熸垚 latest.json锛堢鍚?+ 鍝堝笇 + 涓嬭浇鍦板潃锛?
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          bundle=$(ls dist-assets/VoiceBar_*x64-setup.exe | head -n1)
          node scripts/make-latest-json.mjs \
            --tag "${{ needs.create-release.outputs.tag }}" --repo "${{ github.repository }}" \
            --bundle "$bundle" --out latest.json
          cat latest.json
      - name: 涓婁紶 latest.json 鍒拌崏绋?Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.create-release.outputs.tag }}" latest.json \
            --repo "${{ github.repository }}" --clobber

  publish:
    name: 鑽夌杞负姝ｅ紡 Release
    needs: [create-release, build]
    if: needs.create-release.outputs.should-build == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - name: 鏍￠獙璧勪骇涓庢洿鏂版竻鍗?
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          assets=$(gh api "repos/$REPO/releases/$RELEASE_ID" --jq '.assets[].name')
          echo "$assets"
          missing=0
          for suffix in x64-setup.exe x64_en-US.msi; do
            if ! grep -q "$suffix" <<<"$assets"; then
              echo "::error::缂哄皯璧勪骇锛?$suffix"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          # If a signing key is configured, the updater manifest is mandatory and
          # must agree with the published installer, otherwise clients would
          # either never update or fail signature verification after download.
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            if ! grep -q '^latest.json$' <<<"$assets"; then
              echo "::error::缂哄皯 latest.json锛堝凡閰嶇疆绛惧悕瀵嗛挜锛屽簲鐢ㄥ唴鏇存柊渚濊禆璇ユ枃浠讹級"
              exit 1
            fi
            mkdir -p verify
            gh release download "$TAG" --repo "$REPO" --pattern "latest.json" --dir verify
            gh release download "$TAG" --repo "$REPO" --pattern "*x64-setup.exe" --dir verify
            node scripts/verify-release.mjs --manifest verify/latest.json --assets-dir verify \
              --tag "$TAG" --repo "$REPO"
          fi
          gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" -F draft=false >/dev/null
          echo "宸插彂甯冿細https://github.com/$REPO/releases/tag/$TAG"
