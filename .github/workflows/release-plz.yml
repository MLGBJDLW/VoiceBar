name: Release PR

# Two jobs with different tokens on purpose:
#  * release-pr   – CHANGELOG + version updates, opened as a PR. Without a
#                   repository secret it falls back to GITHUB_TOKEN, which is
#                   enough to open the PR; CI still runs on that PR.
#  * release      – only runs after commits land on main. It creates the
#                   Annotated Tag + Draft GitHub Release, so it needs a token
#                   with workflow scope: set RELEASE_PLZ_TOKEN to a fine-grained
#                   PAT (Contents: read/write) or a classic token (repo, workflow).
#                   Without it, tags created by GITHUB_TOKEN would be blocked
#                   while the Release workflow tries to upload assets.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild:
        description: 为已存在的最新标签重新触发构建（不创建新版本）
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release-pr:
    name: 更新版本与 CHANGELOG（PR）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !inputs.rebuild }}
    steps:
      - name: 检出（完整历史，release-plz 需要标签信息）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
      - name: release-plz PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

  release:
    name: 创建标签与草稿 Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !inputs.rebuild }}
    steps:
      - name: 检出（完整历史）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
      - name: release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

  rebuild:
    name: 为最新标签重新构建
    runs-on: ubuntu-latest
    if: ${{ inputs.rebuild }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 解析最新标签
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "resolved latest tag: $tag"
      - name: 用 Release 工作流重新构建该标签
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f tag=${{ steps.tag.outputs.tag }}
