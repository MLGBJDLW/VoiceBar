name: Release PR

# Two jobs with different tokens on purpose:
#  * release-pr   – Cargo version + CHANGELOG updates in a PR. GITHUB_TOKEN
#                   can open the PR if repository settings allow it, but its
#                   events do not trigger downstream CI automatically.
#  * release      – creates vX.Y.Z tags and draft GitHub releases on main.
#                   RELEASE_PLZ_TOKEN (fine-grained Contents + Pull requests
#                   read/write, or classic repo + workflow) enables downstream
#                   CI and the native Windows Release workflow.
# voicebar-release-tools stays internal and does not get its own release.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild:
        description: 为已存在的最新标签重新触发构建（不创建新版本）
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release-pr:
    name: 更新版本与 CHANGELOG（PR）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !inputs.rebuild }}
    steps:
      - name: 检出（完整历史，release-plz 需要标签信息）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
      - name: release-plz PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

  release:
    name: 创建标签与草稿 Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !inputs.rebuild }}
    steps:
      - name: 检出（完整历史）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
      - name: release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

  rebuild:
    name: 为最新标签重新构建
    runs-on: ubuntu-latest
    if: ${{ inputs.rebuild }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 解析最新标签
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "resolved latest tag: $tag"
      - name: 用 Release 工作流重新构建该标签
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f tag=${{ steps.tag.outputs.tag }}
