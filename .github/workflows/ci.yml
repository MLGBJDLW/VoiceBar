name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality:
    name: 发布脚本与 workspace 配置
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 发布清单测试（无 npm 依赖）
        run: node --test tests/update-manifest.test.mjs
      - name: 校验 Cargo 与 release-plz 配置
        shell: python
        run: |
          import json, pathlib, tomllib

          root = pathlib.Path(".")
          with open("Cargo.toml", "rb") as f:
              workspace = tomllib.load(f)["workspace"]
          with open("crates/voicebar/Cargo.toml", "rb") as f:
              cargo = tomllib.load(f)["package"]
          with open("release-plz.toml", "rb") as f:
              cfg = tomllib.load(f)
          with open("docs/release-plz.schema.json", "rb") as f:
              schema = json.load(f)
          with open(".release-plz/changelog.toml", "rb") as f:
              tomllib.load(f)

          assert "crates/voicebar" in workspace["members"], "native crate missing from workspace"
          assert cargo["name"] == "voicebar"
          assert cargo["version"], "Cargo package version is required"
          assert not set(cfg) - {"workspace", "package", "changelog"}, "unknown release-plz tables"
          defs = schema["$defs"]
          assert not set(cfg["workspace"]) - set(defs["Workspace"]["properties"]), "unknown workspace keys"
          known = set(defs["PackageSpecificConfigWithName"]["properties"])
          packages = {}
          for entry in cfg["package"]:
              assert not set(entry) - known, f"unknown package keys: {entry}"
              assert entry["name"] not in packages, "duplicate release-plz package"
              packages[entry["name"]] = entry
          assert packages["voicebar"]["version_group"] == "voicebar"
          assert packages["voicebar-release-tools"]["release"] is False
          assert cfg["workspace"]["publish"] is False, "crates.io publication must stay disabled"
          assert cfg["workspace"]["git_tag_name"] == "v{{ version }}"
          assert "v{{ version }}" in cfg["workspace"]["git_release_name"]
          assert cfg["workspace"]["git_release_draft"] is True

          locks = sorted(str(p).replace("\\", "/") for p in root.glob("crates/**/Cargo.lock"))
          assert not locks, f"member lockfiles are ignored by Cargo: {locks}"
          assert root.joinpath("Cargo.lock").stat().st_size > 0, "root Cargo.lock is missing or empty"
          print(f"native workspace: {cargo['name']} {cargo['version']}; release configuration OK")
      - name: 校验只有根目录 Cargo.lock 被跟踪
        shell: bash
        run: |
          set -euo pipefail
          tracked=$(git ls-files -- 'Cargo.lock' '*/Cargo.lock')
          test "$tracked" = "Cargo.lock" || { echo "::error::expect one tracked root Cargo.lock, found: ${tracked:-none}"; exit 1; }

  rust:
    name: Rust 原生测试与构建（Windows MSVC）
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: windows-msvc
      - name: 定位 Windows SDK shader 编译器
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin" -Filter fxc.exe -Recurse |
            Where-Object FullName -Match '[\\/]x64[\\/]fxc\.exe$' |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe was not found' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - name: Rust 格式检查
        run: cargo fmt --all -- --check
      - name: Rust workspace 测试
        run: cargo test --workspace --locked --target x86_64-pc-windows-msvc
      - name: 原生便携版生产构建
        shell: pwsh
        run: ./scripts/build.ps1 -Mode portable -Target x86_64-pc-windows-msvc
      - name: 记录产物体积
        shell: pwsh
        run: |
          if (-not (Test-Path 'VoiceBar.exe')) { throw 'missing VoiceBar.exe' }
          Get-Item 'VoiceBar.exe' | Select-Object Name, Length | Format-Table
