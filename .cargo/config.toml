[build]
target = "x86_64-pc-windows-gnu"

[target.x86_64-pc-windows-gnu]
# Use the installed MinGW import libraries (DWM, scaling and registry APIs).
linker = "gcc"

[env]
# The Windows SDK shader compiler; individual build environments can override it.
GPUI_FXC_PATH = { value = "C:/Program Files (x86)/Windows Kits/10/bin/10.0.18362.0/x64/fxc.exe", force = false }
