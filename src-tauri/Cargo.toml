[package]
name = "voicebar"
version = "0.1.0"
description = "A light, expressive desktop voice input bar"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/MLGBJDLW/VoiceBar"
homepage = "https://github.com/MLGBJDLW/VoiceBar#readme"
authors = ["MLGBJDLW"]
keywords = ["voice", "dictation", "speech", "tauri"]
categories = ["gui"]
publish = false

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
# In-app updates. Only Rust-side APIs are used, so no JS guest bindings are needed.
# Pinned: the response `signature` is unsigned, so the updater must also compare
# it with the version bound into the signature's trusted comment
# (`requireSignedVersion`); passing `--app-version` at sign time relies on it.
tauri-plugin-updater = "~2.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
hmac = "0.13"
sha2 = "0.11"
httpdate = "1"
url = "2"
cpal = "0.16"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp"] }
