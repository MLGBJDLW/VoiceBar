<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <!-- Opaque background: Windows ICO icons must not depend on transparency compositing. -->
  <rect width="64" height="64" fill="#111715"/>
  <rect x="6" y="6" width="52" height="52" rx="14" fill="#17201d" stroke="#a7e8cf" stroke-opacity="0.28" stroke-width="1.4"/>
  <!-- Narrow strokes at 16px: five bars with real gaps, tapering outward. -->
  <g fill="#a7e8cf" stroke="#a7e8cf" stroke-linecap="round" stroke-width="4.6">
    <line x1="13.5" y1="27" x2="13.5" y2="37"/>
    <line x1="21.75" y1="18.5" x2="21.75" y2="45.5"/>
    <line x1="30" y1="10.5" x2="30" y2="53.5"/>
    <line x1="38.25" y1="18.5" x2="38.25" y2="45.5"/>
    <line x1="46.5" y1="27" x2="46.5" y2="37"/>
  </g>
</svg>
