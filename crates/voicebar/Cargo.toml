[package]
name = "voicebar"
version = "0.2.0"
description = "A native GPU-accelerated desktop voice input bar"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/MLGBJDLW/VoiceBar"
homepage = "https://github.com/MLGBJDLW/VoiceBar#readme"
authors = ["MLGBJDLW"]
keywords = ["voice", "dictation", "speech", "gpui"]
categories = ["gui"]
publish = false

[dependencies]
gpui = { version = "=0.2.2", default-features = false }
gpui-component = { version = "=0.5.1", default-features = false }
global-hotkey = "0.9"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
hmac = "0.13"
sha2 = "0.11"
httpdate = "1"
url = "2"
cpal = "0.16"
semver = "1"
minisign-verify = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
minisign = "0.10"

[build-dependencies]
embed-resource = "3"
