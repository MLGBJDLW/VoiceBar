# Rust workspace release configuration, validated against the vendored schema.
# The application version lives in crates/voicebar/Cargo.toml; Cargo.lock lives
# at the repository root. No frontend or bundler version needs synchronization.

[workspace]
allow_dirty = false
changelog_config = ".release-plz/changelog.toml"
publish = false
release_always = true
semver_check = false
pr_labels = ["release"]
git_release_enable = true
git_release_draft = true
git_release_name = "VoiceBar v{{ version }}"
git_tag_enable = true
git_tag_name = "v{{ version }}"

[[package]]
name = "voicebar"
version_group = "voicebar"

[[package]]
name = "voicebar-release-tools"
release = false
