# release-plz configuration.
#
# Top level keys are only `workspace`, `package` and `changelog` (see
# docs/release-plz.schema.json, which this file is validated against in CI).
# Everything global goes under `workspace`; per-package overrides are a
# `[[package]]` array. `version_group` is a package-level key: it is what keeps
# the Cargo, package.json and tauri.conf.json versions moving together.
"$schema" = "./docs/release-plz.schema.json"

[workspace]
allow_dirty = false
changelog_config = ".release-plz/changelog.toml"
publish = false
release_always = true
semver_check = false
pr_labels = ["release"]
git_release_enable = true
git_release_draft = true
git_release_name = "VoiceBar v{{ version }}"
git_tag_enable = true
git_tag_name = "v{{ version }}"

[[package]]
name = "voicebar"
version_group = "voicebar"
