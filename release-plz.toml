# release-plz configuration. This is TOML, not JSON: release-plz and the
# "check release-plz config" CI step both parse it with a TOML parser, so a
# JSON body here fails the whole frontend/config job. Keep it in sync with
# `.release-plz/changelog.toml`.
allow_dirty = false
changelog_config = ".release-plz/changelog.toml"
publish = false
release_always = true
semver_check = false
pr_labels = ["release"]
git_release_enable = true
git_release_draft = true
git_release_name = "VoiceBar v{{ version }}"
git_tag_enable = true
git_tag_name = "v{{ version }}"

[package]
version_group = "voicebar"
