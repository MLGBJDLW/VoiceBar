[workspace]
members = ["crates/voicebar", "crates/release-tools"]
resolver = "2"

[workspace.metadata.release]
# release-plz reads release configuration from release-plz.toml.

# Workspace members share these profiles; Cargo only reads them at the root.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 8
strip = true
panic = "abort"

[profile.dev]
debug = 0
incremental = false
